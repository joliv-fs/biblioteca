# Nome da aplicação (aparece nos logs)
spring.application.name=api

# ---------------------------------------------------------------
# BANCO DE DADOS
# ---------------------------------------------------------------

# Endereço do banco. "file" = o banco é um ARQUIVO no disco.
# ./data/biblioteca → cria o arquivo api/data/biblioteca.mv.db
# (o "./" é a pasta de onde a API foi iniciada, por isso rodamos sempre de dentro de api/)
# Se fosse "jdbc:h2:mem:biblioteca", o banco ficaria só na MEMÓRIA e sumiria ao parar a API.
spring.datasource.url=jdbc:h2:file:./data/biblioteca

# Usuário e senha do banco. "sa" com senha vazia é o padrão do H2.
spring.datasource.username=sa
spring.datasource.password=

# ---------------------------------------------------------------
# JPA / HIBERNATE
# ---------------------------------------------------------------

# O que o Hibernate faz com as tabelas quando a API sobe:
# update = cria as tabelas que faltam e acrescenta colunas novas, SEM apagar os dados.
# É por isso que ninguém precisa escrever SQL: as tabelas nascem das classes Java.
spring.jpa.hibernate.ddl-auto=update

# Mostra no terminal o SQL que o Hibernate gera. Serve só para a gente ver o que acontece.
spring.jpa.show-sql=true

# Boa prática: todo acesso ao banco acontece dentro do service.
# O Spring Boot deixa isso ligado (true) por padrão e mostra um aviso no log.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------
# CONSOLE DO H2
# ---------------------------------------------------------------

# Liga a página http://localhost:8080/h2-console
spring.h2.console.enabled=true